<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VM-Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="rotate-message">
        <div class="message-content">
            <div class="phone-icon">🔄</div>
            <h2>Please Rotate Your Device</h2>
            <p>This dashboard is designed for landscape view.</p>
        </div>
    </div>

    <div class="main-container">
        <header class="header">
            <div class="logo">VM-GAME</div>
            <nav class="nav-links">
                <div class="nav-item active">Home</div>
                <div class="nav-item">Apps</div>
                <div class="nav-item">Games</div>
                <div class="nav-item">Leaderboard</div>
            </nav>
        </header>

        <section class="hero">
            <h1 class="hero-title">sales sprint</h1>
            <p id="hero-desc">Track your daily targets and compete with your team.</p>
            <div class="play-button">Open Dashboard</div>
        </section>

        <section class="shelf">
            <h2 class="shelf-title">Top Picks</h2>
            <div class="tile-row">
                <div class="tile focused">
                    <div class="tile-overlay">
                        <div class="tile-label">Tariff Titan</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="tile-overlay">
                        <div class="tile-label">Broadband Blitz</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="tile-overlay">
                        <div class="tile-label">Team Scores</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
