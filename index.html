<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VM-Game Hub</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="rotate-message">
        <div class="message-content">
            <div class="phone-icon material-icons-outlined">screen_rotation</div>
            <h2>Please Rotate Your Device</h2>
            <p>This dashboard is designed for landscape view.</p>
        </div>
    </div>

    <div class="background-watermark"></div>

    <div class="main-container">
        <header class="header">
            <div class="header-spacer"></div> 
            <nav class="nav-links">
                <div class="nav-item active"><span class="material-icons-outlined">home</span> HOME</div>
                <div class="nav-item"><span class="material-icons-outlined">apps</span> APPS</div>
                <div class="nav-item"><span class="material-icons-outlined">sports_esports</span> GAMES</div>
                <div class="nav-item"><span class="material-icons-outlined">leaderboard</span> LEADERBOARD</div>
            </nav>
            <div class="settings-btn material-icons-outlined" id="settings-trigger">settings</div>
        </header>

        <main class="content-area">
            <section class="hero">
                <h1 class="hero-title">sales sprint</h1>
                <p id="hero-desc">Track targets and team performance.</p>
                </section>

            <section class="shelf">
                <div class="tile-row">
                    <div class="tile focused">
                        <span class="tile-icon material-icons-outlined">stars</span>
                        <div class="tile-overlay"><div class="tile-label">TARIFF TITAN</div></div>
                    </div>
                    <div class="tile">
                        <span class="material-icons-outlined tile-icon">wifi</span>
                        <div class="tile-overlay"><div class="tile-label">BROADBAND</div></div>
                    </div>
                    <div class="tile">
                        <span class="material-icons-outlined tile-icon">group</span>
                        <div class="tile-overlay"><div class="tile-label">SCORES</div></div>
                    </div>
                    <div class="tile">
                        <span class="material-icons-outlined tile-icon">emoji_events</span>
                        <div class="tile-overlay"><div class="tile-label">INCENTIVES</div></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
