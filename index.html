<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Hub Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!--          VIEW 1: HOME DASHBOARD            -->
    <!-- ========================================== -->
    <div id="dashboard-view" class="view">
        <header class="app-header">
            <h1>RETAIL HUB</h1>
            <button id="settings-trigger" class="icon-btn">⚙️</button>
        </header>

        <main class="grid-container">
            <!-- Game Launcher Tile -->
            <div class="tile focused" id="tile-titan">
                <div class="tile-icon">⚡</div>
                <div class="tile-title">Tariff Titans</div>
            </div>

            <!-- High Scores Tile -->
            <div class="tile" id="highscore-trigger">
                <div class="tile-icon">🏆</div>
                <div class="tile-title">High Scores</div>
            </div>

            <div class="tile">
                <div class="tile-icon">📈</div>
                <div class="tile-title">Performance</div>
            </div>

            <div class="tile">
                <div class="tile-icon">📋</div>
                <div class="tile-title">Briefings</div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!--          VIEW 2: GAMEPLAY SCREEN           -->
    <!-- ========================================== -->
    <div id="game-view" class="view hidden">
        <header class="game-header">
            <button id="game-back-btn" class="back-btn">⬅️ Exit</button>
            <div class="game-stats">
                <span class="stat-item">🏆 Score: <strong id="game-score">0</strong></span>
                <span class="stat-item">⏱️ Time: <strong id="game-timer">20</strong>s</span>
            </div>
        </header>

        <main class="game-container">
            <div class="scenario-box">
                <p id="scenario-text">Loading training matrix scenario...</p>
            </div>
            <div id="options-container" class="options-grid">
                <!-- Dynamic answer buttons -->
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!--        VIEW 3: TOP 10 HIGH SCORES          -->
    <!-- ========================================== -->
    <div id="highscore-view" class="view hidden">
        <header class="game-header">
            <button id="highscore-back-btn" class="back-btn">⬅️ Dashboard</button>
        </header>
        <main class="center-content" style="padding-top: 10px;">
            <div class="local-leaderboard-container">
                <table class="local-leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Score</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Scores dynamically injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!--       MODAL: SECURITY PIN PASSCODE         -->
    <!-- ========================================== -->
    <div id="auth-panel" class="modal-overlay hidden">
        <div class="pin-modal">
            <button id="auth-close" class="close-btn">×</button>
            <h3>Admin Security Entry</h3>
            <div class="pin-display">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>
            <div class="pin-grid">
                <button class="pin-btn" data-value="1">1</button>
                <button class="pin-btn" data-value="2">2</button>
                <button class="pin-btn" data-value="3">3</button>
                <button class="pin-btn" data-value="4">4</button>
                <button class="pin-btn" data-value="5">5</button>
                <button class="pin-btn" data-value="6">6</button>
                <button class="pin-btn" data-value="7">7</button>
                <button class="pin-btn" data-value="8">8</button>
                <button class="pin-btn" data-value="9">9</button>
                <button id="pin-clear" class="pin-btn action">⌫</button>
                <button class="pin-btn" data-value="0">0</button>
                <button id="pin-submit" class="pin-btn action">✓</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!--         MODAL: CONTROLLER SETTINGS         -->
    <!-- ========================================== -->
    <div id="admin-panel" class="modal-overlay hidden">
        <div class="admin-container">
            <header class="admin-header">
                <h2>Matrix Config Manager</h2>
                <button id="admin-close" class="close-btn">×</button>
            </header>

            <div class="admin-body">
                <section class="admin-section form-card">
                    <h3>Add / Edit Scenario Block</h3>
                    <div class="input-group">
                        <label>Scenario Description Prompt</label>
                        <textarea id="form-text" placeholder="Type retail query here..."></textarea>
                    </div>
                    <div class="form-grid-2x2">
                        <div class="input-sub"><label>Option A</label><input type="text" id="form-optA"></div>
                        <div class="input-sub"><label>Option B</label><input type="text" id="form-optB"></div>
                        <div class="input-sub"><label>Option C</label><input type="text" id="form-optC"></div>
                        <div class="input-sub"><label>Option D</label><input type="text" id="form-optD"></div>
                    </div>
                    <div class="input-group select-wrapper">
                        <label>Target Key Correct Identifier</label>
                        <select id="form-correct">
                            <option value="" disabled selected>Select Correct Answer Variable Option</option>
                            <option value="A">Option A</option>
                            <option value="B">Option B</option>
                            <option value="C">Option C</option>
                            <option value="D">Option D</option>
                        </select>
                    </div>
                    <button id="add-scenario-btn" class="action-btn-primary">⚡ COMMIT SCENARIO ELEMENT</button>
                </section>

                <section class="admin-section">
                    <h3>Loaded Scenarios: (<span id="question-count">0</span> Items)</h3>
                    <div id="scenarios-list-container" class="admin-feed-scroller"></div>
                </section>

                <section class="admin-section">
                    <h3>JSON Output</h3>
                    <textarea id="json-output" readonly></textarea>
                    <button id="copy-json-btn" class="action-btn-secondary">📋 COPY UPDATED JSON</button>
                </section>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!--  ISOLATED INLINE STYLES FOR LEADERBOARD    -->
    <!-- ========================================== -->
    <style>
        .local-leaderboard-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .local-leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .local-leaderboard-table th, 
        .local-leaderboard-table td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .local-leaderboard-table th {
            color: #ff3366;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .local-leaderboard-table td {
            color: #ffffff;
            font-size: 0.95rem;
        }
        .local-leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .local-leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: 700; } 
        .local-leaderboard-table tr:nth-child(2) td { color: #c0c0c0; font-weight: 700; } 
        .local-leaderboard-table tr:nth-child(3) td { color: #cd7f32; font-weight: 700; }
    </style>

    <script src="script.js"></script>
</body>
</html>
