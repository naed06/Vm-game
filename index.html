<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Sprint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN DASHBOARD -->
    <div id="main-menu" class="container">
        <div class="header">
            <div class="logo">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            </div>
            <button id="admin-btn" class="icon-btn">⚙️</button>
        </div>

        <div class="grid">
            <div class="card" id="start-game-btn">
                <div class="card-icon">🎯</div>
                <div class="card-title">Tariff Titan</div>
            </div>
            <div class="card locked">
                <div class="card-icon">🔒</div>
                <div class="card-title">Broadband</div>
            </div>
            <div class="card locked">
                <div class="card-icon">🔒</div>
                <div class="card-title">TV & Stream</div>
            </div>
            <div class="card locked">
                <div class="card-icon">🔒</div>
                <div class="card-title">Leaderboard</div>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="container hidden">
        <div class="game-header">
            <button id="back-btn" class="txt-btn">◀ Exit</button>
            <div class="timer">Time: <span id="time-left">20</span>s</div>
            <div class="score">Score: <span id="score">0</span></div>
        </div>

        <div class="question-box">
            <p id="question-text">Loading...</p>
        </div>

        <div class="options-grid" id="options-grid">
            <!-- Dynamic Buttons -->
        </div>
    </div>

    <!-- PIN ENTRY MODAL -->
    <div id="pin-modal" class="modal hidden">
        <div class="modal-content pin-content">
            <h3>Enter Admin PIN</h3>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••">
            <div class="modal-actions">
                <button id="pin-cancel" class="modal-btn cancel">Cancel</button>
                <button id="pin-submit" class="modal-btn confirm">Submit</button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content admin-content">
            <div class="admin-header">
                <h3>Manage Questions</h3>
                <button id="admin-close" class="close-btn">&times;</button>
            </div>
            
            <div class="admin-body">
                <div class="add-question-form">
                    <input type="text" id="new-q-text" placeholder="Question Text">
                    <input type="text" id="new-q-a" placeholder="Option A">
                    <input type="text" id="new-q-b" placeholder="Option B">
                    <input type="text" id="new-q-c" placeholder="Option C">
                    <input type="text" id="new-q-d" placeholder="Option D">
                    <select id="new-q-correct">
                        <option value="" disabled selected>Select Correct Option</option>
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                    <button id="save-q-btn" class="modal-btn confirm">Add Question</button>
                </div>

                <div class="questions-list" id="questions-list">
                    <!-- Added questions show up here -->
                </div>

                <div class="json-export-box">
                    <label>Data Package Output:</label>
                    <textarea id="json-output" readonly></textarea>
                    <button id="copy-json" class="modal-btn standard">Copy Data Package</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
