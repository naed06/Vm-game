<style>
  /* 1. Maximize Viewport for TV Layout */
  .quiz-page-active .main-nav-bar {
    padding-top: 4px;
    padding-bottom: 4px;
  }
  .quiz-page-active .main-nav-links {
    display: none; /* Hides menu items mid-game to save 20% screen space */
  }

  /* 2. Game Header Row (Metadata) */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    width: 100%;
  }

  .game-meta-pills {
    display: flex;
    gap: 8px;
  }

  .score-pill, .timer-pill {
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  /* 3. The Screen Split Wrapper */
  .quiz-layout-container {
    display: flex;
    gap: 16px;
    width: 100%;
    height: calc(100vh - 110px); /* Locks container to viewport height */
    align-items: stretch;
  }

  /* Left Side: Scenario Card (Wider & Flatter) */
  .scenario-card {
    flex: 55; /* Takes 55% of horizontal space */
    background: rgba(20, 11, 43, 0.7);
    border-left: 4px solid #e50914; /* Virgin red accent */
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
    overflow-y: auto;
  }

  .scenario-card h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #aaa;
    margin: 0 0 8px 0;
  }

  .scenario-card p {
    font-size: 1.15rem;
    line-height: 1.4;
    margin: 0;
    font-weight: 500;
  }

  /* Right Side: 2x2 Answer Grid */
  .answers-grid {
    flex: 45; /* Takes 45% of horizontal space */
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    box-sizing: border-box;
  }

  /* 4. Compact TV-Style Answer Buttons */
  .answer-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-size: 0.9rem; /* Scaled down slightly to fit text */
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    line-height: 1.3;
    box-sizing: border-box;
  }

  .answer-btn:hover, .answer-btn:focus {
    background: #fff;
    color: #140b2b;
    border-color: #fff;
    transform: scale(1.02);
    outline: none;
  }
</style>

<!-- Optimized HTML Layout Structure -->
<div class="quiz-page-active">
  
  <!-- Single horizontal row for all controls/meta -->
  <div class="game-header">
    <button class="back-hub-btn" onclick="backToHub()">← BACK TO HUB</button>
    <div class="game-meta-pills">
      <div class="score-pill">SCORE: <span id="current-score">0</span></div>
      <div class="timer-pill">TIMER: <span id="current-timer">16s</span></div>
    </div>
  </div>

  <!-- The Main Gameplay Canvas -->
  <div class="quiz-layout-container">
    
    <!-- Scenario on Left -->
    <div class="scenario-card">
      <h3>Scenario:</h3>
      <p>A customer looking at Volt SIMO options asks what 'Extra' benefit they get if they take the premium 'Ultimate' tier plan.</p>
    </div>

    <!-- 2x2 Grid on Right -->
    <div class="answers-grid">
      <button class="answer-btn">A choice of an Extra from Disney+, Amazon, and more for the lifetime of the Ultimate Plan</button>
      <button class="answer-btn">A choice of an Extra from Disney+, Amazon, and more for 3 months</button>
      <button class="answer-btn">They only receive standard O2 Priority access</button>
      <button class="answer-btn">A choice of an Extra from Disney+, Amazon, and more for 6 months</button>
    </div>

  </div>
</div>
