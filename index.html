<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Training Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Top Navigation Bar -->
        <header class="header">
            <div class="nav-links">
                <div class="nav-item" id="nav-search">Search 🔍</div>
                <div class="nav-item active" id="nav-home">Home</div>
                <div class="nav-item" id="nav-guide">Guide</div>
                <div class="nav-item" id="nav-apps">Apps</div>
                <div class="nav-item" id="nav-games">Games</div>
            </div>
            <div class="user-status">
                <span class="icon">⚙️</span>
                <span class="icon">👤</span>
            </div>
        </header>

        <!-- Hero Feature Section (Top 2/3) -->
        <section class="hero" id="hero-section">
            <div class="hero-content">
                <h1 id="hero-title">sales sprint</h1>
                <p id="hero-desc">1 series • Simulation • Strategy</p>
                <div class="play-button">Play</div>
            </div>
        </section>

        <!-- Mini-Game Shelf (Bottom 1/3) -->
        <section class="shelf">
            <h2 class="shelf-title">Top picks</h2>
            <div class="tile-row" id="game-row">
                <div class="tile focused" data-name="sales sprint" data-desc="1 series • Simulation • Strategy">
                    <div class="tile-overlay">
                        <span class="tile-label">Sales Sprint</span>
                    </div>
                </div>
                <div class="tile" data-name="tariff titan" data-desc="1 series • Trivia • Mobile">
                    <div class="tile-overlay">
                        <span class="tile-label">Tariff Titan</span>
                    </div>
                </div>
                <div class="tile" data-name="service star" data-desc="1 series • Puzzle • Care">
                    <div class="tile-overlay">
                        <span class="tile-label">Service Star</span>
                    </div>
                </div>
                <div class="tile" data-name="leaderboard" data-desc="Global • Standings • Rewards">
                    <div class="tile-overlay">
                        <span class="tile-label">Leaderboard</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
